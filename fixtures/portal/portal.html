<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>富文本门户的语义化录入与回读</title>
<style>
  body{font:18px sans-serif;margin:24px}
  label,button{margin:8px}
  article[contenteditable]{min-height:160px;border:1px solid #888;padding:12px}
  canvas{display:block;border:1px solid #888}
  pre,output{white-space:pre-wrap}
  nav{display:flex;flex-wrap:wrap;gap:4px}
</style>
<body>
  <h1>安装说明草稿</h1>
  <p id="revision" aria-live="polite"></p>
  <nav aria-label="编辑工具栏">
    <button data-command="bold">强调</button>
    <button data-command="insertOrderedList">有序步骤</button>
    <button data-command="insertUnorderedList">要点</button>
    <button data-command="outdent">减少缩进</button>
    <button data-command="indent">增加缩进</button>
    <button data-block="blockquote">警告块</button>
    <button data-block="p">段落</button>
    <button id="link">链接</button>
    <button data-command="unlink">取消链接</button>
  </nav>
  <article contenteditable="true" role="textbox" aria-label="说明正文" id="editor"></article>
  <button id="save">保存草稿</button>
  <button id="reload">重新读取</button>
  <p id="notice" role="status"></p>
  <script type="module" src="/client.js"></script>
</body>
</html>
